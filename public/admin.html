<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HCCDA-AI Admin Monitor</title>
<style>
:root{--ink:#102a43;--muted:#52606d;--paper:#f8f5ef;--panel:#fffdf9;--line:#d9e2ec;--teal:#087f8c;--coral:#e76f51;--green:#237a57;--red:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,rgba(8,127,140,.07) 25%,transparent 25%) 0 0/28px 28px,var(--paper);font-family:"Trebuchet MS","Segoe UI",sans-serif}.shell{width:min(1250px,calc(100% - 32px));margin:auto}.top{padding:26px 0 18px;border-bottom:1px solid #ccd6df;display:flex;align-items:end;justify-content:space-between;gap:15px}.eyebrow{font-size:12px;color:var(--teal);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.top h1{font:42px Georgia,serif;margin:8px 0 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px #102a4315}.login{max-width:470px;margin:65px auto;padding:28px}.login h2{font:25px Georgia,serif;margin:0 0 18px}.field{display:grid;gap:6px;margin:14px 0}label{font-size:13px;font-weight:800}input{padding:12px;border:1px solid #bcccdc;border-radius:6px;font:inherit;width:100%}button{border:0;border-radius:6px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#e8f1f2;color:var(--ink)}.error{color:var(--red);font-size:13px;min-height:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 15px;flex-wrap:wrap}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px 16px;border-left:4px solid var(--coral);background:#fff}.stat strong{font-size:22px;display:block}.stat span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}th,td{padding:13px 11px;text-align:left;border-bottom:1px solid var(--line)}th{background:#e8f5f4;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.clickable{cursor:pointer}.clickable:hover{background:#f1f8f7}.badge{padding:4px 7px;border-radius:4px;font-size:11px;font-weight:900;white-space:nowrap}.submitted{background:#e2f2e8;color:var(--green)}.in-progress{background:#fff3d6;color:#795500}.terminated-tab-switch{background:#fde7e5;color:var(--red)}.empty{padding:35px;color:var(--muted);text-align:center}.detail{margin-top:22px;padding:24px;display:none}.detail h2{font:25px Georgia,serif;margin:0 0 4px}.detail p{color:var(--muted);margin:4px 0 18px}.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.question{border:1px solid var(--line);border-left:4px solid var(--coral);padding:12px;font-size:13px}.question.correct{border-left-color:var(--green)}.question h3{font-size:13px;margin:0 0 7px}.question p{font-size:12px;margin:3px 0}.wrong{color:var(--red)}.right{color:var(--green)}@media(max-width:700px){.top h1{font-size:31px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">HCCDA-AI admissions</div><h1>Student monitor</h1></div><button id="logout" class="secondary" style="display:none">Log out</button></header><section id="login" class="panel login"><h2>Admin access</h2><div class="field"><label for="key">Admin key</label><input id="key" type="password" autocomplete="current-password"></div><div id="error" class="error"></div><button id="login-button" class="primary">Open records</button></section><section id="dashboard" style="display:none"><div class="toolbar"><div class="stats"><div class="stat"><strong id="total">0</strong><span>total attempts</span></div><div class="stat"><strong id="complete">0</strong><span>completed</span></div><div class="stat"><strong id="average">0%</strong><span>average score</span></div></div><div><button id="refresh" class="secondary">Refresh records</button> <button id="export" class="primary">Download Excel CSV</button> <button id="reset-all" class="secondary">Reset all records</button></div></div><div class="panel" style="overflow:auto"><table><thead><tr><th>Student</th><th>CNIC</th><th>Phone</th><th>Marks</th><th>Percent</th><th>Status</th><th>Tab switches</th><th>Started</th><th>Delete</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="panel detail"><h2 id="detail-title"></h2><p id="detail-meta"></p><div id="review" class="review"></div></section></section></main>
<script>
let key='';let records=[];const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
async function load(){const response=await fetch('/api/admin/attempts?key='+encodeURIComponent(key));if(!response.ok)throw new Error('Invalid admin key.');records=await response.json();render();}
function render(){records=records.filter(r=>r&&typeof r==='object'&&!Array.isArray(r));const done=records.filter(r=>r.status!=='in-progress');$('total').textContent=records.length;$('complete').textContent=done.length;$('average').textContent=done.length?Math.round(done.reduce((sum,r)=>sum+(r.percentage||0),0)/done.length)+'%':'0%';$('rows').innerHTML=records.length?records.map((r,i)=>{const status=r.status||'unknown';return `<tr class="clickable" data-index="${i}"><td><b>${esc(r.name||'Unknown')}</b></td><td>${esc(r.cnic)}</td><td>${esc(r.phone)}</td><td>${r.score||0}/${r.total||40}</td><td>${r.percentage||0}%</td><td><span class="badge ${status}">${status.replace(/-/g,' ')}</span></td><td>${r.tabSwitches||0}/3</td><td>${r.startedAt?new Date(r.startedAt).toLocaleString():'-'}</td><td><button class="secondary delete-record" data-id="${r.id}" data-name="${esc(r.name||'student')}" type="button">Delete</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">No student attempts yet.</td></tr>';document.querySelectorAll('[data-index]').forEach(row=>row.onclick=()=>showDetail(records[Number(row.dataset.index)]));document.querySelectorAll('.delete-record').forEach(button=>button.onclick=event=>{event.stopPropagation();deleteRecord(button.dataset.id,button.dataset.name)});}
async function showDetail(record){const response=await fetch('/api/attempts/'+record.id+'/review');if(!response.ok)return;const data=await response.json();const correct=new Map(data.correctAnswers.map(item=>[item.questionId,item.answer]));$('detail').style.display='block';$('detail-title').textContent=record.name+' / '+record.score+'/'+record.total;$('detail-meta').textContent=record.cnic+' | '+record.phone+' | '+record.status+' | '+record.tabSwitches+' tab switches';$('review').innerHTML=data.questions.map((q,i)=>{const chosen=data.answers[q.id];const isCorrect=chosen===correct.get(q.id);return `<article class="question ${isCorrect?'correct':''}"><h3>${i+1}. ${esc(q.domain)}</h3><p>${esc(q.prompt)}</p><p class="${isCorrect?'right':'wrong'}"><b>${isCorrect?'Correct':'Wrong / unanswered'}</b> | Student: ${chosen===undefined?'None':esc(q.options[chosen])}</p><p><b>Correct:</b> ${esc(q.options[correct.get(q.id)])}</p></article>`}).join('');$('detail').scrollIntoView({behavior:'smooth'});}
async function deleteRecord(id,name){if(!confirm(`Permanently delete the record for ${name}?`))return;const response=await fetch('/api/admin/attempts/'+id+'?key='+encodeURIComponent(key),{method:'DELETE'});if(!response.ok){const data=await response.json();alert(data.error||'Could not delete record.');return;}$('detail').style.display='none';await load();}
async function resetAllRecords(){if(!confirm('Permanently delete ALL student records?'))return;if(!confirm('This cannot be undone. Delete all records now?'))return;const response=await fetch('/api/admin/attempts?key='+encodeURIComponent(key),{method:'DELETE'});if(!response.ok){const data=await response.json();alert(data.error||'Could not reset records.');return;}$('detail').style.display='none';await load();}
$('login-button').onclick=async()=>{try{key=$('key').value;await load();$('login').style.display='none';$('dashboard').style.display='block';$('logout').style.display='block';}catch(error){$('error').textContent=error.message}};$('refresh').onclick=load;$('export').onclick=()=>{window.location='/api/admin/export?key='+encodeURIComponent(key)};$('reset-all').onclick=resetAllRecords;$('logout').onclick=()=>window.location.reload();
</script></body></html>
